name: DevOps / Stale

on:
  schedule:
    - cron: "31 0 2 * *"  # monthly scattered (was: 0 6 * * 1)
  workflow_dispatch:
  push:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stale:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-stale.yml@v1.2.0
    with:
      only: "both"
