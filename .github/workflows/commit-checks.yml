name: Commit Checks (pre-commit + uv)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-checks:
    if: ${{ !github.event.pull_request.draft }}
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-test.yml@8405bfc6e887b6e1af634a6ed104538ab98d3baf # main@8405bfc — post-v1.3.1, unreleased (release-please manifest is stale)
    with:
      python-version: "3.13"
      uv-extras: "dev cli"
      test-dir: "tests/unit_tests"
