name: Code Coverage (Codecov — Python + uv)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    timeout-minutes: 30
    if: ${{ !github.event.pull_request.draft }}
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-coverage.yml@1ce012b023b91e4c293846af4cfd93062d36d1be
    with:
      python-version: "3.13"
      uv-extras: "dev cli server grpc"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
