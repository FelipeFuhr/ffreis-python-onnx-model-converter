# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    # scan-fix(dependency-review:unsupported-on-private): added the
    # `repository.private == false` clause. The Dependency Review API requires
    # GitHub Advanced Security on private repositories, which this fleet does
    # not have, so the job failed with "Dependency review is not supported on
    # this repository" on EVERY run -- a permanently-red check that never
    # reviewed anything. Same reasoning as the fleet-wide `upload-sarif: false`
    # convention for security scanners. Skipping is honest; a red no-op is not.
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
