name: gRPC Sync

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  grpc-sync-and-parity:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-run-commands.yml@v1.2.0
    with:
      setup-python: true
      python-version: "3.13"
      setup-uv: true
      timeout-minutes: 30
      commands: |-
        set -euo pipefail
        uv sync --extra dev --extra server --extra grpc
        ./scripts/check_grpc_stubs.sh
        uv run pytest -q tests/integration_tests/test_grpc_parity.py
