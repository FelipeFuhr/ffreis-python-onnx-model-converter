name: Build All

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-all:
    name: Build All (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [python, container]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: ${{ matrix.component == 'python' }}
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        if: ${{ matrix.component == 'python' }}
        with:
          enable-cache: true
      - name: Require lock
        if: ${{ matrix.component == 'python' }}
        run: test -s uv.lock || (echo "uv.lock missing — run uv lock"; exit 1)
      - name: Install deps (dev + cli)
        if: ${{ matrix.component == 'python' }}
        run: |
          set -euo pipefail
          uv sync --extra dev --extra cli
      - name: Run tests
        if: ${{ matrix.component == 'python' }}
        run: |
          set -euo pipefail
          uv run pytest -q tests/unit_tests
      - name: Build package artifacts
        if: ${{ matrix.component == 'python' }}
        run: |
          set -euo pipefail
          uv build
      - name: Install Podman
        if: ${{ matrix.component == 'container' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build images
        if: ${{ matrix.component == 'container' }}
        run: |
          set -euo pipefail
          PYTHON_VERSION=3.13 make build
