name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ffreis-org/ffreis-workflows-python/.github/workflows/python-lint.yml@v1.0.1
    with:
      python-version: "3.13"
      uv-extras: "dev"
