name: Unit Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "src/**"
      - "proto/**"
      - "tests/unit_tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - "scripts/generate_grpc_stubs.sh"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "proto/**"
      - "tests/unit_tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - "scripts/generate_grpc_stubs.sh"
      - ".github/workflows/tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        with:
          enable-cache: true
      - name: Require uv.lock
        run: |
          set -euo pipefail
          test -s uv.lock || (echo "uv.lock missing — run uv lock"; exit 1)
      - name: Install dependencies
        run: |
          set -euo pipefail
          uv sync --extra dev --extra cli --extra runtime --extra server --extra grpc
      - name: Generate gRPC stubs
        run: ./scripts/generate_grpc_stubs.sh
      - name: Run unit tests
        run: uv run pytest tests/unit_tests
