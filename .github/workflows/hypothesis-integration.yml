name: Hypothesis Integration

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
    paths:
      - "tests/integration_tests/test_grpc_parity.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/hypothesis-integration.yml"
  schedule:
    - cron: "11 1 17 * *"  # monthly scattered (was: 45 10 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hypothesis:
    # scan-fix(ci:hypothesis-no-draft): skip draft PRs to avoid wasted CI minutes
    if: ${{ !github.event.pull_request.draft }}
    name: Hypothesis Property Tests
    runs-on: ubuntu-latest
    # scan-fix(ci:timeout-minutes): timeout on direct job, not on uses: caller
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        with:
          enable-cache: true

      - name: Assert uv.lock exists
        run: |
          set -euo pipefail
          test -s uv.lock || (echo "uv.lock missing — run uv lock"; exit 1)

      - name: Install deps (frozen)
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra server --extra grpc --extra sklearn

      - name: Generate gRPC stubs
        # scan-fix(ci:grpc-stubs-before-hypothesis): the reusable python-hypothesis.yml
        # has no pre-test-script hook; without stubs converter_grpc imports fail and
        # pytest_skip fires on the whole file, giving exit code 5 (no tests collected).
        # Inlined here until ffreis-workflows-python adds a pre-test-script input.
        run: ./scripts/generate_grpc_stubs.sh

      - name: Run Hypothesis tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          set -euo pipefail
          uv run --frozen pytest tests/integration_tests/test_grpc_parity.py
