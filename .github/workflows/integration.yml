name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "0 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (Secure Default)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          enable-cache: true

      - name: Require uv.lock
        run: test -s uv.lock || (echo "uv.lock missing — run uv lock"; exit 1)

      - name: Install deps (dev + all)
        run: uv sync --extra dev --extra all

      - name: Run integration tests
        run: |
          uv run pytest -q tests/integration_tests \
            --cov=onnx_converter \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-fail-under=0
          test -s coverage.xml

      - name: Upload integration coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          files: ./coverage.xml
          flags: integration
          name: integration-coverage
          fail_ci_if_error: false
          verbose: true

  integration-tf-legacy:
    name: Integration (TF Legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          enable-cache: true

      - name: Require uv.lock
        run: test -s uv.lock || (echo "uv.lock missing — run uv lock"; exit 1)

      - name: Install deps (dev + cli + runtime + tf_legacy)
        run: uv sync --extra dev --extra cli --extra runtime --extra tf_legacy

      - name: Run TensorFlow integration tests
        run: |
          uv run pytest -q tests/integration_tests -k tensorflow \
            --cov=onnx_converter \
            --cov-report=xml:coverage-tf.xml \
            --cov-report=term \
            --cov-fail-under=0
          test -s coverage-tf.xml

      - name: Upload TensorFlow integration coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          files: ./coverage-tf.xml
          flags: integration-tf-legacy
          name: integration-tf-legacy-coverage
          fail_ci_if_error: false
          verbose: true
