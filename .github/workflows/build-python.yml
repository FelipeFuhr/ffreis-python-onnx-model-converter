name: Build All (Python + uv)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix-build:
    timeout-minutes: 30
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-build.yml@1ce012b023b91e4c293846af4cfd93062d36d1be
    with:
      python-versions: '["3.14", "3.13", "3.11", "3.10"]'
      uv-extras: "dev cli"
      test-dir: "tests/unit_tests"
