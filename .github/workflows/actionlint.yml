name: DevOps / Actionlint

on:
  pull_request:
  push:
    branches: [main, master]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-actionlint.yml@v1.2.0
    with:
      working-directory: .
