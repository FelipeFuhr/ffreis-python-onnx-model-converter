name: DevOps / Semantic PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-pr:
    permissions:
      contents: read
    uses: ffreis-org/ffreis-workflows-general/.github/workflows/general-semantic-pr.yml@v1.2.0
