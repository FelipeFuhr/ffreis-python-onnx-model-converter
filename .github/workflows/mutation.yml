name: Mutation Testing (mutmut)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mutation.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "24 4 8 * *"  # monthly scattered (was: 0 2 * * 0)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    if: ${{ (!github.event.pull_request.draft) && (github.event_name != 'pull_request') }}
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-mutation.yml@6c507728c6d3dc346cbeb1fe19df72de018bd5b4 # v1.7.0
    with:
      runner: '["ubuntu-latest"]'
      python-version: "3.13"
      # scan-fix(ci:mutmut-baseline): baseline pytest run isn't scoped to
      # tests/unit_tests only, so it also exercises the sklearn CLI roundtrip
      # test -- needs the sklearn extra installed or the baseline run fails.
      uv-extras: "dev cli sklearn"
      paths-to-mutate: "src"
      threshold: 80

  mutation-incremental:
    if: ${{ (!github.event.pull_request.draft) && (github.event_name == 'pull_request') }}
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-mutation.yml@6c507728c6d3dc346cbeb1fe19df72de018bd5b4 # v1.7.0
    with:
      in-diff: true
      runner: '["ubuntu-latest"]'
      python-version: "3.13"
      uv-extras: "dev cli sklearn"
      paths-to-mutate: "src"
      threshold: 80

  notify-failure:
    needs: [mutation]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ [CI] ${context.workflow} failed (${new Date().toISOString().split('T')[0]})`,
              body: [
                `**Workflow:** ${context.workflow}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
