name: Build All

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-all:
    name: Build All (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [python, container]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ matrix.component == 'python' }}
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        if: ${{ matrix.component == 'python' }}
        with:
          enable-cache: true
      - name: Require lock
        if: ${{ matrix.component == 'python' }}
        run: test -s uv.lock || (echo "uv.lock missing — run uv lock"; exit 1)
      - name: Install deps (dev + cli)
        if: ${{ matrix.component == 'python' }}
        run: |
          set -euo pipefail
          uv sync --extra dev --extra cli
      - name: Run tests
        if: ${{ matrix.component == 'python' }}
        run: |
          set -euo pipefail
          uv run pytest -q tests/unit_tests
      - name: Build package artifacts
        if: ${{ matrix.component == 'python' }}
        run: |
          set -euo pipefail
          uv build
      - name: Install Podman
        if: ${{ matrix.component == 'container' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build images
        if: ${{ matrix.component == 'container' }}
        run: |
          set -euo pipefail
          PYTHON_VERSION=3.13 make build

      - name: Install Trivy
        if: ${{ matrix.component == 'container' }}
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan image for vulnerabilities
        if: ${{ matrix.component == 'container' }}
        run: |
          podman save -o /tmp/cli.tar ffreis/onnx-converter-cli
          trivy image \
            --input /tmp/cli.tar \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --format table
