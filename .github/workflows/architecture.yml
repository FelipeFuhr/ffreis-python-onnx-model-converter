name: Architecture

permissions: {}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        with:
          enable-cache: true

      - name: Require lock
        run: test -s uv.lock || (echo "uv.lock missing — run uv lock"; exit 1)

      - name: Install deps
        run: uv sync --extra dev

      - name: Architecture boundaries check
        run: uv run python scripts/check_architecture.py

      - name: Application mypy strict
        run: uv run mypy src/onnx_converter/application

      - name: Orchestrator complexity check
        run: uv run python scripts/check_orchestrator_complexity.py
