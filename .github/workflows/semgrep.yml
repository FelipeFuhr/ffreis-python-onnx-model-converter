name: Semgrep Code Analysis

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-semgrep.yml@1ce012b023b91e4c293846af4cfd93062d36d1be
