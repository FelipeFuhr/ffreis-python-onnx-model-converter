name: Code Coverage (Codecov — Python + uv)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        with:
          enable-cache: true
      - name: Require uv.lock
        run: |
          set -euo pipefail
          test -s uv.lock || (echo "uv.lock missing — run uv lock"; exit 1)
      - name: Install dependencies
        run: |
          set -euo pipefail
          uv sync --extra dev --extra cli --extra runtime --extra server --extra grpc
      - name: Generate gRPC stubs
        run: ./scripts/generate_grpc_stubs.sh
      - name: Run coverage
        run: |
          set -euo pipefail
          uv run pytest tests/unit_tests \
            --cov=onnx_converter \
            --cov-report=xml:coverage.xml \
            --cov-report=term
          test -s coverage.xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
