name: Hypothesis Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "tests/integration_tests/test_grpc_parity.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/hypothesis-integration.yml"
  schedule:
    - cron: "45 10 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hypothesis:
    if: ${{ !github.event.pull_request.draft }}
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-hypothesis.yml@v1.0.1
    with:
      python-version: "3.13"
      uv-extras: "dev server grpc sklearn"
      test-dir: "tests/integration_tests/test_grpc_parity.py"
