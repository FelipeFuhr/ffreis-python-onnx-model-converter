name: DevOps / ShellCheck

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.sh"
      - "Makefile"
  push:
    branches: [main, master]


    paths:
      - "**/*.sh"
      - "Makefile"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-shellcheck.yml@v1.2.0
    with:
      working-directory: .
      fail-on-error: true
