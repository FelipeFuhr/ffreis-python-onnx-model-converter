[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx-model-converter"
version = "0.1.0"
description = "Convert PyTorch, TensorFlow/Keras, and scikit-learn models to ONNX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "idna>=3.15",
    "numpy>=1.26.4; python_version >= '3.10'",
    # tf2onnx (Python <3.13 path) still constrains protobuf<4, which conflicts
    # with onnx>=1.20 (protobuf>=4). Keep latest where possible.
    "onnx>=1.17.0,<1.20; python_version >= '3.10' and python_version < '3.13'",
    "onnx>=1.20.1; python_version >= '3.13'",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
cli = [
    "typer>=0.23.1",
    "rich>=14.3.2",
]
runtime = [
    "onnxruntime>=1.24.1",
    "onnxoptimizer>=0.4.2",
]
torch = [
    "torch>=2.12.0",
    "torchvision>=0.21.0",
    "onnxscript>=0.6.2",
]
# Legacy TensorFlow conversion path. Kept separate because tf2onnx currently
# constrains protobuf<4 on Python <3.13.
tf_legacy = [
    "tensorflow>=2.19.1; python_version < '3.13'",
    "tf2onnx>=1.16.1; python_version < '3.13'",
]
# Backward-compatible alias for existing users.
tensorflow = [
    "tensorflow>=2.19.1; python_version < '3.13'",
    "tf2onnx>=1.16.1; python_version < '3.13'",
]
sklearn = [
    # sklearn conversion extra is currently supported on Python >=3.11 only.
    # Core package remains installable on Python 3.10 for non-sklearn flows.
    "scikit-learn>=1.8.0; python_version >= '3.11'",
    "skl2onnx>=1.20.0; python_version >= '3.11'",
    # strongly recommended for loading:
    "joblib>=1.5.3; python_version >= '3.11'",
    # recommended for safer sklearn serialization:
    "skops>=0.13.0; python_version >= '3.11'",
]
xgboost = [
    # onnxmltools bridges XGBoost -> ONNX; skl2onnx provides FloatTensorType.
    "xgboost>=2.0",
    "onnxmltools>=1.12.0",
    "skl2onnx>=1.20.0; python_version >= '3.11'",
    "onnxruntime>=1.24.1",
]
lightgbm = [
    # onnxmltools bridges LightGBM -> ONNX; skl2onnx provides FloatTensorType.
    "lightgbm>=4.0",
    "onnxmltools>=1.12.0",
    "skl2onnx>=1.20.0; python_version >= '3.11'",
    "onnxruntime>=1.24.1",
]

# TensorFlow example-only dependency set pinned for compatibility.
tf_example = [
    "tensorflow>=2.19,<2.20; python_version < '3.13'",
    "tf2onnx>=1.16,<1.17; python_version < '3.13' and sys_platform != 'win32'",
    "protobuf>=3.20,<4; python_version < '3.13' and sys_platform != 'win32'",
]
optuna = [
    "optuna>=4.7.0",
]
dev = [
    "hypothesis>=6.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mutmut>=2.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "black>=26.3.1",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.31",
]
grpc = [
    # Generated stubs currently enforce grpcio >=1.78.0.
    # Protobuf differs by Python line due TensorFlow/tf2onnx legacy constraints.
    "grpcio>=1.78.0",
    "protobuf>=6.31.1; python_version >= '3.13'",
    "protobuf>=3.20,<4; python_version < '3.13'",
]
all = [
    "onnxruntime>=1.24.1",
    "onnxoptimizer>=0.4.2",
    "typer>=0.23.1",
    "rich>=14.3.2",
    "torch>=2.12.0",
    "torchvision>=0.21.0",
    "onnxscript>=0.6.2",
    "optuna>=4.7.0",
]

[dependency-groups]
dev = [
    "lightgbm>=4.6.0",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.24.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "scikit-learn>=1.7.2",
    "skl2onnx>=1.20.0",
    "xgboost>=3.2.0",
]

[project.scripts]
# Typer app entrypoint (recommended)
convert-to-onnx = "onnx_converter.cli:app"
converter-http = "onnx_converter.converter.http_server:main"
converter-grpc = "onnx_converter.converter.grpc_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["onnx_converter"]
force_single_line = true
skip_gitignore = true

# flake8 config lives in .flake8 (flake8 7.x does not read pyproject.toml).

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = "(venv|.venv|tests/helpers|src/converter_grpc)"
files = ["src"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["onnx_converter.cli.cli"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["onnx_converter.converter.http_server"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["onnx_converter.converters.pytorch_converter", "onnx_converter.converters", "onnx_converter"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["onnx_converter.adapters.parity_checkers", "onnx_converter.adapters.loaders"]
ignore_errors = true

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", "venv", "__pycache__", "src/converter_grpc"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.isort]
# scan-fix(ruff:I001): pin both packages as first-party so ruff's import-section
# detection is stable regardless of whether the generated converter_grpc stubs
# (converter_pb2.py / converter_pb2_grpc.py) are present on disk.  The stubs are
# produced by generate_grpc_stubs.sh and are git-ignored; they are absent in
# lint-only CI runs, causing ruff to classify converter_grpc as third-party and
# therefore expect a different blank-line layout than when the stubs exist locally.
known-first-party = ["onnx_converter", "converter_grpc"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"src/onnx_converter/cli/cli.py" = ["B008"]
"src/onnx_converter/types.py" = ["UP040"]
"examples/**/*.py" = ["D", "ANN"]
"scripts/**/*.py" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests", "tests/integration_tests", "tests/e2e_tests"]
addopts = "--strict-markers --tb=short -ra --import-mode=importlib"
markers = [
    "unit: fast, isolated unit tests",
    "integration: integration tests that may require optional deps",
    "e2e: end-to-end tests that exercise the public CLI flow",
    "asyncio: async tests executed with pytest-asyncio",
    "property: property-based tests (typically Hypothesis)",
]

[tool.coverage.run]
branch = true
source = ["onnx_converter"]
parallel = true
patch = ["subprocess"]
omit = [
    "tests/*",
    "examples/*",
    "scripts/*",
    # scan-fix(coverage:optional-extras): server files require grpc/fastapi extras
    # that are not installed in the baseline test run (dev + cli only).
    # Their unit tests use pytest.importorskip and are collected but skipped when
    # the extras are absent. Omitting here keeps the 92% gate meaningful for
    # core logic that is always exercised.
    "*/onnx_converter/converter/grpc_server.py",
    "*/onnx_converter/converter/http_server.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 92

[tool.uv]
resolution = "highest"
conflicts = []
