name: Format

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-fmt.yml@v1.0.1
    with:
      python-version: "3.13"
      uv-extras: "dev"
