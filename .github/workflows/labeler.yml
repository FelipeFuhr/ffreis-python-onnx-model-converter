name: DevOps / Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-labeler.yml@v1.2.0
    with:
      rules-json: |-
        [
          {"label": "ci", "title": "/ci/i", "patterns": [".github/workflows/**"]},
          {"label": "infra", "title": "/infra/i"},
          {"label": "python", "patterns": ["**/*.py", "pyproject.toml", "uv.lock"]},
          {"label": "docs", "patterns": ["**/*.md"]}
        ]
