name: Code Security (Python Deps Audit)

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "36 22 4 * *"  # monthly scattered (was: 0 9 * * 1)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps-security:
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-security.yml@v1.0.1
    with:
      python-version: "3.13"
