name: Lock Sync

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-sync:
    uses: ffreis-org/ffreis-workflows-python/.github/workflows/python-lock-sync.yml@v1.0.1
    with:
      python-version: "3.13"
